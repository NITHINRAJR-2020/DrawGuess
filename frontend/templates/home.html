    <script>
        const canvas = document.getElementById('canvas1');
        const ctx = canvas.getContext('2d');
        let username = "";
        let rword = "";
        let ws = null;
        document.getElementById("click").addEventListener("click", function () {

            username = document.getElementById("user").value;
            ws = new WebSocket("ws://localhost:7000/ws");
            ws.onopen = () => {
                ws.send(JSON.stringify({ "event": "join", "username": username }));
            }

            document.getElementById("lobby").style.display = "block";
            document.getElementById("login").style.display = "none";

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data)
                switch (msg.event) {
                    case "status":
                        let ul = document.getElementById("onlineMember");
                        ul.innerHTML = "";
                        let users = msg.data;
                        for (const user of users) {
                            let li = document.createElement("li");
                            li.textContent = `${user.username} – ${user.status === "ready" ? "🟢 Ready" : "🔴 Not Ready"}`;
                            li.style.color = user.status === "ready" ? "limegreen" : "red";
                            ul.appendChild(li);
                            ul.scrollTop = ul.scrollHeight;
                        }
                        break;

                    case "start":
                        document.getElementById("lobby").style.display = "none";
                        document.getElementById("chat").style.display = "block";
                        // document.getElementById("canva1").style.display="block";
                        document.getElementById("role").innerHTML = msg.role;
                        if (msg.role == 'dumb') {
                            document.getElementById("dumbView").style.display = "block";
                            document.getElementById("memberView").style.display = "none";
                            game();
                            initcanva();
                        }
                        else {
                            document.getElementById("dumbView").style.display = "none";
                            document.getElementById("memberView").style.display = "block";
                        }
                        break;

                    case 'timeup':
                        alert("time up no one wins ");
                        ctx.clearRect(0,0,canvas.width,canvas.height);
                        break;
                        
                    case "wrong":
                        alert("wrong");
                        break;

                    case "gameover":
                        winner = msg.winner;
                        console.log(winner)
                        alert("congratualation ");
                        ctx.clearRect(0,0,canvas.width,canva.height)        
                        break;

                    case "draw":
                        data = msg.data;
                        drawLine(data.x1, data.y1, data.x2, data.y2, data.color, data.width);
                        break;

                    case "clear":
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        break;
                }


            }
        });



        const btn = document.getElementById("readyBtn");
        let isReady = false;

        btn.addEventListener("click", () => {
            isReady = !isReady;

            if (isReady) {
                btn.textContent = "Ready";
                btn.classList.remove("not-ready");
                btn.classList.add("ready");
            } else {
                btn.textContent = "Not Ready";
                btn.classList.remove("ready");
                btn.classList.add("not-ready");
            }
            ws.send(JSON.stringify({
                "event": "status",
                "status": isReady ? "ready" : "not ready"
            }))
        });

        function initcanva() {


            let is_erasing = 0;


            document.getElementById("pen").addEventListener("click", function () {
                is_erasing = 0;


            });
            document.getElementById("eraser").addEventListener("click", function () {
                is_erasing = 1;

            });




            let drawing = false;
            let prevX = 0;
            let prevY = 0;
            document.getElementById("clear").addEventListener("click", function () {
                ws.send(JSON.stringify({ 'event': 'clear' }))
            });


            canvas.addEventListener("mousedown", (e) => {
                drawing = true;
                prevX = e.offsetX;
                prevY = e.offsetY;
            });

            // Drawing in progress
            canvas.addEventListener("mousemove", (e) => {
                if (!drawing) return;
                let width, color;
                if (is_erasing) {
                    width = 10;
                    color = 'white';
                }
                else {
                    width = 2;
                    color = 'black';
                }
                const currX = e.offsetX;
                const currY = e.offsetY;

                // Draw locally
                drawLine(prevX, prevY, currX, currY, color, width);

                ws.send(JSON.stringify({
                    "event": "draw", "data": {
                        x1: prevX,
                        y1: prevY,
                        x2: currX,
                        y2: currY,
                        color: color,
                        width: width
                    }
                }));
                // Send to server


                prevX = currX;
                prevY = currY;
            });

            // End drawing path
            canvas.addEventListener("mouseup", () => {
                drawing = false;

            });
        }
        function drawLine(x1, y1, x2, y2, color, width) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.closePath();
        }
